[project]
name = "wscheck"
version = "0.1.0"
description = "Workstation Health Check CLI"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
  "psutil>=5.9.0",
  "requests>=2.31.0"
]

[project.scripts]
wscheck = "wscheck.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
